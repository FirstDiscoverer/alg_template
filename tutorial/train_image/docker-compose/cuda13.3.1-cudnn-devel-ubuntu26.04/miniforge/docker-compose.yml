x-logging: &default-logging
  driver: json-file
  options:
    max-size: "128m"
    max-file: "10"

x-resources: &default-resources
  limits:
    cpus: "8"
    memory: 16G
  reservations:
    devices:
      - driver: "nvidia"
        count: "all"
        capabilities: [ "gpu" ]

services:
  build_service:
    build:
      context: ../../../
      dockerfile: cuda-miniforge.Dockerfile
      args:
        # 修改镜像名 ①
        BASE_IMAGE: "nvidia/cuda:13.3.1-cudnn-devel-ubuntu26.04"
    # 修改镜像名 ②
    image: "alg:cuda13.3.1-cudnn8-devel-ubuntu26.04-miniforge"
    restart: unless-stopped
    deploy:
      resources: *default-resources
    logging: *default-logging
    tty: true

# docker-compose build --progress plain --no-cache
