x-logging: &default-logging
  driver: json-file
  options:
    max-size: "128m"
    max-file: "10"

x-resources: &default-resources
  limits:
    cpus: "8"
    memory: 16G

services:
  build_service:
    image: "ubuntu:26.04"
    restart: unless-stopped
    deploy:
      resources: *default-resources
    logging: *default-logging
    tty: true

