[program:app_demo]
command = /home/%(ENV_USER_NAME)s/Software/miniforge/bin/python -u -c "import time, datetime; [print(datetime.datetime.now()) or time.sleep(5) for _ in iter(lambda: 0, 1)]"
; directory=/home/%(ENV_USER_NAME)s/.../项目名
user = %(ENV_USER_NAME)s
; 如果不指定下面的的HOME和USER，有些程序使用普通用户会有问题，比如Streamlit
environment=HOME="/home/%(ENV_USER_NAME)s",USER="%(ENV_USER_NAME)s"
autostart = true
startretries = 3
autorestart = true
stopasgroup = true
killasgroup = true
logfile_maxbytes = 1MB
logfile_backups=1
loglevel = debug